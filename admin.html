<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop360 | Admin quản lý hình ảnh</title>
    <style>
      :root {
        --primary: #ff6a00;
        --primary-dark: #e35b00;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --success: #16a34a;
        --danger: #dc2626;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fff7f0, #f5f7fb);
        color: var(--text);
      }

      img {
        display: block;
        max-width: 100%;
      }

      button, input, select {
        font: inherit;
      }

      .admin-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .auth-card,
      .dashboard-card {
        width: min(1100px, 100%);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .auth-card {
        max-width: 460px;
        padding: 32px 28px;
      }

      .auth-card h2 {
        margin: 0 0 8px;
        font-size: 2rem;
        text-align: center;
      }

      .auth-subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        text-align: center;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .form-group label {
        font-weight: 700;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        min-height: 46px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
      }

      .primary-btn,
      .secondary-btn,
      .ghost-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 20px;
        border-radius: 12px;
        border: none;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .primary-btn {
        width: 100%;
        background: var(--primary);
        color: #fff;
      }

      .primary-btn:hover {
        background: var(--primary-dark);
      }

      .secondary-btn {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .ghost-btn {
        background: rgba(255, 106, 0, 0.08);
        color: var(--primary);
        border: 1px solid rgba(255, 106, 0, 0.2);
      }

      .login-note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .error-message {
        min-height: 20px;
        margin-top: 12px;
        color: var(--danger);
        font-weight: 700;
        text-align: center;
      }

      .hidden {
        display: none !important;
      }

      .dashboard-card {
        padding: 28px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--primary);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }

      .product-list {
        display: grid;
        gap: 20px;
      }

      .product-item {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 22px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #fff;
      }

      .product-thumb {
        width: 190px;
        height: 170px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: linear-gradient(135deg, #f8fafc, #eef2ff);
      }

      .product-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .product-details {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }

      .product-name {
        margin: 0;
        font-size: 1.3rem;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label {
        font-size: 0.92rem;
        font-weight: 700;
      }

      .field select {
        min-height: 46px;
        width: min(420px, 100%);
        padding: 0 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
      }

      .action-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .status-message {
        min-height: 20px;
        margin: 0;
        color: var(--success);
        font-weight: 700;
      }

      .top-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      @media (max-width: 760px) {
        .product-item {
          grid-template-columns: 1fr;
        }

        .product-thumb {
          width: 100%;
          height: 220px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .top-actions {
          width: 100%;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div id="loginScreen" class="auth-card">
        <h2>Đăng nhập Admin</h2>
        <p class="auth-subtitle">Quản lý hình ảnh sản phẩm Shop360</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input id="username" name="username" type="text" placeholder="admin" />
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" placeholder="admin" />
          </div>

          <button type="submit" class="primary-btn">Đăng nhập</button>
          <p class="login-note">Tài khoản mặc định: admin / admin</p>
          <p id="loginError" class="error-message"></p>
        </form>
      </div>

      <div id="dashboard" class="dashboard-card hidden">
        <div class="topbar">
          <div>
            <p class="eyebrow">Trang quản trị</p>
            <h1>Quản lý ảnh sản phẩm</h1>
          </div>

          <div class="top-actions">
            <button type="button" class="secondary-btn" id="previewHomeBtn">Xem trang chủ</button>
            <button type="button" class="ghost-btn" id="logoutBtn">Đăng xuất</button>
          </div>
        </div>

        <div class="product-list">
          <div class="product-item" data-key="shop360-product-0" data-default="images/denim.webp">
            <div class="product-thumb">
              <img class="preview-image" src="images/denim.webp" alt="Ảnh sản phẩm 1" />
            </div>
            <div class="product-details">
              <h3 class="product-name">Áo khoác denim</h3>
              <div class="field">
                <label for="select-0">Chọn hình ảnh có sẵn</label>
                <select id="select-0">
                  <option value="images/denim.webp">denim.webp</option>
                  <option value="images/giay-trang.webp">giay-trang.webp</option>
                  <option value="images/may-anh.webp">may-anh.webp</option>
                  <option value="images/tai-nghe.webp">tai-nghe.webp</option>
                </select>
              </div>
              <div class="action-row">
                <button type="button" class="primary-btn update-btn">Cập nhật</button>
                <p class="status-message"></p>
              </div>
            </div>
          </div>

          <div class="product-item" data-key="shop360-product-1" data-default="images/giay-trang.webp">
            <div class="product-thumb">
              <img class="preview-image" src="images/giay-trang.webp" alt="Ảnh sản phẩm 2" />
            </div>
            <div class="product-details">
              <h3 class="product-name">Giày sneaker trắng</h3>
              <div class="field">
                <label for="select-1">Chọn hình ảnh có sẵn</label>
                <select id="select-1">
                  <option value="images/denim.webp">denim.webp</option>
                  <option value="images/giay-trang.webp">giay-trang.webp</option>
                  <option value="images/may-anh.webp">may-anh.webp</option>
                  <option value="images/tai-nghe.webp">tai-nghe.webp</option>
                </select>
              </div>
              <div class="action-row">
                <button type="button" class="primary-btn update-btn">Cập nhật</button>
                <p class="status-message"></p>
              </div>
            </div>
          </div>

          <div class="product-item" data-key="shop360-product-2" data-default="images/may-anh.webp">
            <div class="product-thumb">
              <img class="preview-image" src="images/may-anh.webp" alt="Ảnh sản phẩm 3" />
            </div>
            <div class="product-details">
              <h3 class="product-name">Máy ảnh compact</h3>
              <div class="field">
                <label for="select-2">Chọn hình ảnh có sẵn</label>
                <select id="select-2">
                  <option value="images/denim.webp">denim.webp</option>
                  <option value="images/giay-trang.webp">giay-trang.webp</option>
                  <option value="images/may-anh.webp">may-anh.webp</option>
                  <option value="images/tai-nghe.webp">tai-nghe.webp</option>
                </select>
              </div>
              <div class="action-row">
                <button type="button" class="primary-btn update-btn">Cập nhật</button>
                <p class="status-message"></p>
              </div>
            </div>
          </div>

          <div class="product-item" data-key="shop360-product-3" data-default="images/tai-nghe.webp">
            <div class="product-thumb">
              <img class="preview-image" src="images/tai-nghe.webp" alt="Ảnh sản phẩm 4" />
            </div>
            <div class="product-details">
              <h3 class="product-name">Tai nghe Bluetooth</h3>
              <div class="field">
                <label for="select-3">Chọn hình ảnh có sẵn</label>
                <select id="select-3">
                  <option value="images/denim.webp">denim.webp</option>
                  <option value="images/giay-trang.webp">giay-trang.webp</option>
                  <option value="images/may-anh.webp">may-anh.webp</option>
                  <option value="images/tai-nghe.webp">tai-nghe.webp</option>
                </select>
              </div>
              <div class="action-row">
                <button type="button" class="primary-btn update-btn">Cập nhật</button>
                <p class="status-message"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const loginKey = 'shop360-admin-logged-in';
      const loginScreen = document.getElementById('loginScreen');
      const dashboard = document.getElementById('dashboard');
      const loginForm = document.getElementById('loginForm');
      const loginError = document.getElementById('loginError');
      const logoutBtn = document.getElementById('logoutBtn');
      const previewHomeBtn = document.getElementById('previewHomeBtn');

      function setAuthState(isLoggedIn) {
        loginScreen.classList.toggle('hidden', isLoggedIn);
        dashboard.classList.toggle('hidden', !isLoggedIn);
      }

      function applySavedSelections() {
        const productItems = document.querySelectorAll('.product-item');

        productItems.forEach((item) => {
          const key = item.dataset.key;
          const select = item.querySelector('select');
          const preview = item.querySelector('.preview-image');
          const defaultValue = item.dataset.default;
          const storedValue = localStorage.getItem(key) || defaultValue;
          const updateBtn = item.querySelector('.update-btn');

          if (select.dataset.bound !== 'true') {
            select.addEventListener('change', () => {
              preview.src = select.value;
              const status = item.querySelector('.status-message');
              status.textContent = '';
            });
            select.dataset.bound = 'true';
          }

          if (updateBtn.dataset.bound !== 'true') {
            updateBtn.addEventListener('click', () => {
              const chosenValue = select.value;
              localStorage.setItem(key, chosenValue);
              preview.src = chosenValue;
              const status = item.querySelector('.status-message');
              status.textContent = 'Đã lưu và áp dụng.';
            });
            updateBtn.dataset.bound = 'true';
          }

          select.value = storedValue;
          preview.src = storedValue;
        });
      }

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username === 'admin' && password === 'admin') {
          localStorage.setItem(loginKey, 'true');
          loginError.textContent = '';
          setAuthState(true);
          applySavedSelections();
          return;
        }

        loginError.textContent = 'Sai tên đăng nhập hoặc mật khẩu.';
      });

      logoutBtn.addEventListener('click', () => {
        localStorage.removeItem(loginKey);
        loginForm.reset();
        setAuthState(false);
      });

      previewHomeBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      if (localStorage.getItem(loginKey) === 'true') {
        setAuthState(true);
        applySavedSelections();
      } else {
        setAuthState(false);
      }
    </script>
  </body>
</html>
